[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-generation-agent"
version = "1.0.0"
description = "Generate source-grounded podcast scripts and audio from PDFs."
requires-python = ">=3.10"
dependencies = [
    "dspy>=2.6,<4.0",
    "edge-tts",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "langgraph>=0.2,<2.0",
    "python-multipart>=0.0.9,<1.0",
    "pypdf>=5.0.0,<7.0.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
podcast-generator = "podcast_generator.cli:main"
podcast-telegram-set-webhook = "podcast_generator.telegram.set_webhook:main"

[tool.setuptools.packages.find]
include = ["podcast_generator*"]
